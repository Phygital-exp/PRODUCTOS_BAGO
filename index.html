<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bago</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon -->
    <link rel="icon" href="Bago_logo.png" type="image/png">
</head>
<body>

    <div class="container">
        <div class="search-container">
            Búsqueda datos Bago
            <br>
            <button id="darkModeToggle" class="btn btn-dark">🌙 Modo claro</button>

            <select id="grillaSelect" class="form-select mt-3" onchange="handleGrillaChange()">
                <option value="">Seleccione la grilla</option>
            </select>

            <input type="text" id="searchInput" class="form-control mt-3" placeholder="Selecciona primero una grilla" oninput="handleInput()" disabled>

            <div id="results"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
